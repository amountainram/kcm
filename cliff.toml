# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# replace REPO_URL placeholder with the actual repository base URL (edit per repo)
postprocessors = [
    { pattern = "REPO_URL", replace = "https://github.com/amountainram/kcm" },
]

# template for the changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits -%}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}
        {% if commit.breaking_description and commit.breaking_description != commit.message %}
            > **Breaking:** {{ commit.breaking_description | trim | replace(from="\n", to="\n> ") }}
        {% elif commit.breaking and commit.body %}
            > **Breaking:** {{ commit.body | trim | replace(from="\n", to="\n> ") }}
        {% endif -%}
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
{% for release in releases -%}
    {% if release is defined and release.version is defined -%}
        {% if release.previous is defined and release.previous.version is defined -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                REPO_URL\
                    /compare/{{ release.previous.version }}...{{ release.version }}
        {% endif -%}
    {% else -%}
        [unreleased]: REPO_URL\
            /compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# remove the leading and trailing whitespace from the templates
trim = true

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# only consider chart tags (v*), ignore keycloak@* docker tags
tag_pattern = "^v[0-9]"
commit_preprocessors = [
    { pattern = "Merge branch '([0-9A-Za-z/-_:()])'", replace = "$1" },
]
# regex for parsing and grouping commits
commit_parsers = [
    { message = "^[cC]hore: [rR]elease", skip = true },
    { message = "^[cC]hore\\([rR]elease\\)", skip = true },
    { message = "^[Rr]elease", skip = true },
    { message = "^([^!]+)!:", group = "BREAKING" },
    { message = "^feat(\\([^)]+\\))?:", group = "Added" },
    { message = "^chore(\\([^)]+\\))?:", group = "Changed" },
    { message = "^test(\\([^)]+\\))?:", group = "Changed" },
    { message = "^fix(\\([^)]+\\))?:", group = "Fixed" },
    { message = "^fix\\(deps\\)", group = "Dependencies" },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^refactor(\\([^)]+\\))?:", group = "Changed" },
    { message = "^style(\\([^)]+\\))?:", group = "Changed" },
    { message = "^perf(\\([^)]+\\))?:", group = "Changed" },
    { message = "^bump", group = "Dependencies" },
    { message = "^docs(\\([^)]+\\))?:", group = "Documentation" },
    { message = "^.*: add", group = "Added" },
    { message = "^.*: support", group = "Added" },
    { message = "^.*: remove", group = "Removed" },
    { message = "^.*: delete", group = "Removed" },
    { message = "^.*: replace", group = "Changed" },
]
# filter out the commits that are not matched by commit parsers
filter_commits = true
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "newest"

# regex for skipping tags
skip_tags = "beta|alpha"
# regex for ignoring tags
ignore_tags = "rc"
